apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeassistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://pajikos.github.io/home-assistant-helm-chart/
    targetRevision: 13.4.0
    chart: home-assistant
    helm:
      values: |
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: stable
        
        persistence:
          config:
            enabled: true
            storageClass: "standard"
            size: 10Gi
        
        ingress:
          main:
            enabled: true
            annotations:
              kubernetes.io/ingress.class: nginx
            hosts:
              - host: homeassistant.local
                paths:
                  - path: /
                    pathType: Prefix
        
        service:
          main:
            type: ClusterIP
            ports:
              http:
                port: 8123
        
        securityContext:
          privileged: false
  
  destination:
    server: https://kubernetes.default.svc
    namespace: home-automation
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
